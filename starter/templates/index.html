<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Sudoku</h1>
    <div class="controls-top">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option>Easy</option>
        <option selected>Medium</option>
        <option>Hard</option>
      </select>
      <button id="new-game">New Game</button>
      <button id="hint">Hint</button>
      <button id="check-solution">Check</button>
      <button id="theme-toggle" aria-label="Toggle theme">☀️</button>
      <div class="timer" id="timer">00:00</div>
    </div>
    
  </header>

  <main>
    <section id="game-area">
      <div id="message" role="status" aria-live="polite"></div>
      <div id="sudoku-board" aria-label="Sudoku board"></div>
    </section>

    <aside id="leaderboard">
      <h2>Top 10</h2>
      <table id="leaderboard-table" aria-label="Leaderboard">
        <thead>
          <tr>
            <th>Name</th>
            <th>Time</th>
            <th>Level</th>
            <th>Hints</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </aside>
  </main>

  <div id="win-popup" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="win-popup-title">
    <div class="modal-panel">
      <h2 id="win-popup-title">Congratulations!</h2>
      <p id="win-popup-message"></p>
      <div class="modal-actions">
        <button id="save-score">Save Score</button>
        <button id="close-popup">Close</button>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
